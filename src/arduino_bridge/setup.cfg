# Amaç: arduino_bridge paketinin çalıştırılabilir betik kurulum yolunu belirler.
# Çalışma: setuptools geliştirme ve normal kurulumda betikleri lib/arduino_bridge
# altına yerleştirir; ROS 2 çalıştırılabilir dosyaları bu konumda bulur.

[develop]
script_dir=$base/lib/arduino_bridge
[install]
install_scripts=$base/lib/arduino_bridge
