# Xacro collision geometrilerinin base_link düzlemindeki dış dikdörtgeni.
# Ön +0.07 m, arka -0.18 m, sol/sağ +/-0.12 m; 25 x 24 cm.
# navigation.launch.py iki costmap için bu geometriyi yükler.
# Bu dosya tek başına tam bir Nav2 yapılandırması değildir.
local_costmap:
  local_costmap:
    ros__parameters:
      robot_base_frame: base_link
      footprint: "[[0.07, 0.12], [-0.18, 0.12], [-0.18, -0.12], [0.07, -0.12]]"
      footprint_padding: 0.02

global_costmap:
  global_costmap:
    ros__parameters:
      robot_base_frame: base_link
      footprint: "[[0.07, 0.12], [-0.18, 0.12], [-0.18, -0.12], [0.07, -0.12]]"
      footprint_padding: 0.02
