# İlk navigasyon profili: Humble, Smac 2D + RPP, düşük hızlı diferansiyel sürüş.
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 0.10
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 1.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    odom_topic: /odometry/filtered
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 30.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.20
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.06
      lookahead_dist: 0.25
      min_lookahead_dist: 0.15
      max_lookahead_dist: 0.35
      lookahead_time: 2.0
      use_velocity_scaled_lookahead_dist: true
      rotate_to_heading_angular_vel: 0.30
      transform_tolerance: 0.3
      min_approach_linear_velocity: 0.02
      approach_velocity_scaling_dist: 0.30
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.30
      regulated_linear_scaling_min_speed: 0.02
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.50
      max_angular_accel: 0.50
      allow_reversing: false
      use_interpolation: true
      cost_scaling_dist: 0.20
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 8.0

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_rate_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_remove_passed_goals_action_bt_node

behavior_server:
  ros__parameters:
    costmap_topic: /local_costmap/costmap_raw
    footprint_topic: /local_costmap/published_footprint
    cycle_frequency: 10.0
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.3
    behavior_plugins: [wait]
    wait:
      plugin: nav2_behaviors/Wait

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: true
    feedback: OPEN_LOOP
    # 0.07 + 0.30 * (0.20 / 2) = 0.10 m/s azami tekerlek hızı.
    max_velocity: [0.07, 0.0, 0.30]
    min_velocity: [0.0, 0.0, -0.30]
    max_accel: [0.10, 0.0, 0.50]
    max_decel: [-0.20, 0.0, -0.50]
    odom_topic: /odometry/filtered
    odom_duration: 0.2
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.3

collision_monitor:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /cmd_vel
    transform_tolerance: 0.3
    source_timeout: 0.5
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: [StopZone]
    StopZone:
      type: polygon
      # Xacro dış sınırına her yönde 10 cm başlangıç duruş bölgesi.
      points: [0.17, 0.22, -0.28, 0.22, -0.28, -0.22, 0.17, -0.22]
      action_type: stop
      max_points: 1
      visualize: true
      polygon_pub_topic: /collision_monitor/stop_zone
      enabled: true
    observation_sources: [scan]
    scan:
      type: scan
      topic: /scan
      enabled: true
